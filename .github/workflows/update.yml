name: Auto Update AUR Package

on:
  schedule:
    # 每 4 小时在整点后 20 分触发一次（错开正点高峰，避免 Actions 调度延迟或丢事件）
    - cron: '20 */4 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上随时手动点击触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and essential tools
        run: |
          pacman -Sy --noconfirm git openssh curl jq pacman-contrib

      - name: Checkout GitHub repository
        uses: actions/checkout@v7

      - name: Check upstream latest version
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          API_URL="https://api.github.com/repos/Javis603/token-monitor/releases/latest"
          UPSTREAM_VER=""
          MAX_RETRIES=3

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Fetching upstream latest release (attempt $i/$MAX_RETRIES)..."
            API_RES=$(curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$API_URL" 2>/dev/null || true)

            # 安全提取 tag_name，避免非 JSON 或 null 输入导致 jq 崩溃
            TAG_NAME=$(echo "$API_RES" | jq -r '.tag_name // empty' 2>/dev/null || true)

            if [[ -n "$TAG_NAME" && "$TAG_NAME" != "null" ]]; then
              UPSTREAM_VER="${TAG_NAME#v}"
              break
            fi

            API_MSG=$(echo "$API_RES" | jq -r '.message // empty' 2>/dev/null || true)
            if [[ -n "$API_MSG" ]]; then
              echo "GitHub API message: $API_MSG"
            fi

            if [[ $i -lt $MAX_RETRIES ]]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          if [[ -z "$UPSTREAM_VER" ]]; then
            echo "::warning::Failed to fetch upstream version after $MAX_RETRIES attempts (API error / rate limited)."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 读取当前 PKGBUILD 中的 pkgver
          CURRENT_VER=$(grep -oP '^pkgver=\K.*' PKGBUILD)

          echo "Upstream version: $UPSTREAM_VER"
          echo "Current version:  $CURRENT_VER"

          if [[ "$UPSTREAM_VER" != "$CURRENT_VER" ]]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "new_ver=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD and .SRCINFO
        if: steps.check.outputs.has_update == 'true'
        run: |
          NEW_VER="${{ steps.check.outputs.new_ver }}"

          # makepkg 和 updpkgsums 禁止以 root 运行，需创建临时打包用户 builder
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          su builder -c "
            cd '$GITHUB_WORKSPACE'
            sed -i 's/^pkgver=.*/pkgver=${NEW_VER}/' PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
            updpkgsums
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Commit update back to GitHub repository
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "${{ vars.AUR_USERNAME || 'github-actions[bot]' }}"
          git config user.email "${{ vars.AUR_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: token-monitor-bin ${{ steps.check.outputs.new_ver }}-1"
          git push

      - name: Push to AUR
        if: steps.check.outputs.has_update == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p /root/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> /root/.ssh/known_hosts

          cat <<EOF > /root/.ssh/config
          Host aur.archlinux.org
            User aur
            IdentityFile /root/.ssh/aur
            StrictHostKeyChecking accept-new
          EOF

          # 克隆 AUR 仓库到临时目录，仅复制 PKGBUILD 和 .SRCINFO（避免把 .github 目录推到 AUR）
          git clone ssh://aur@aur.archlinux.org/token-monitor-bin.git /tmp/aur-repo
          cp PKGBUILD .SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git config user.name "${{ vars.AUR_USERNAME }}"
          git config user.email "${{ vars.AUR_EMAIL }}"
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: token-monitor-bin ${{ steps.check.outputs.new_ver }}-1"
          git push origin master
